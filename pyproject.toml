[project]
name = "px0"
dynamic = ["version"]
description = "Build custom agents and workflows using natural language, then run them on a schedule."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Arpit Bhayani", email = "arpit@arpitbhayani.me" }
]
urls = { "Homepage" = "https://github.com/px0-ai/px0", "Repository" = "https://github.com/px0-ai/px0" }
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.30",
    "zstandard>=0.22",
    "croniter>=2.0",
    "beautifulsoup4>=4.12",
    "youtube-transcript-api>=0.6",
    "composio>=0.1.0",
    "packaging>=23.0",
]

[tool.setuptools.dynamic]
version = {attr = "px0.__version__"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.6",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
px0 = "px0.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["px0"]
